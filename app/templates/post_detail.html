{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h1>{{ post.title }}</h1>
    <p>{{ post.description }}</p>

    <hr>
    <p><small>Создан: {{ post.created_at }}</small></p>
    <p><small>Обновлён: {{ post.updated_at }}</small></p>

    <a href="/page">← Назад на главную</a>
{% endblock %}
