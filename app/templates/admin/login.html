{% extends "base.html" %}

{% block title %}Панель администратора{% endblock %}

{% block content %}
<article class="login-card">
    <h1 class="login-detail__title">Вход в админку</h1>

    <form class="login-form divider-top" action="/admin/login" method="post">
        <div class="form-group">
            <label>Логин</label>
            <input class="form-control" type="text" name="username">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input class="form-control" type="password" name="password">
        </div>
        <div class="login-form__actions">
            <button class="btn-primary btn_primary__login">Авторизоваться</button>
        </div>
    </form>
</article>

{% endblock %}
