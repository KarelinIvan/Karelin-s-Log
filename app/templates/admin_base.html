<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Админка{% endblock %}</title>
    <!-- Подключаем те же стили, что и для основного сайта -->
    <!-- Подключение шрифта Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Splash&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Подключение иконок fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="page-wrapper">
        <!-- Левый сайдбар админки -->
        <aside class="sidebar-nav">
            <!-- Верхняя группа -->
            <div class="sidebar-top">
                <div class="sidebar-logo divider-bottom">
                    karelin's admin
                </div>

                <nav class="sidebar-menu">
                    <ul>
                        <li><a href="/page/" class="sidebar-link">На сайт</a></li>
                        <li><a href="/admin/" class="sidebar-link">Дашборд</a></li>
                        <li><a href="/admin/posts/create" class="sidebar-link">Создать пост</a></li>
                        <li><a href="/admin/posts" class="sidebar-link">Список постов</a></li>
                        <!-- Позже добавим управление постами и выход -->
                    </ul>
                </nav>
            </div>

            <!-- Нижняя группа -->
            <div class="sidebar-bottom divider-top">
                <div class="sidebar-actions">
                    <h3 class="widget-title divider-top">Авторизация</h3>
                    <form action="/admin/logout" method="post">
                        <button type="submit" class="btn-secondary btn-block">Выйти</button>
                    </form>
                </div>
                <div class="copyright divider-top">
                    <p>&copy; 2026 Karelin's log</p>
                </div>
            </div>
        </aside>

        <!-- Контентная часть (без правого сайдбара) -->
        <div class="main-content">
            <main>
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
</body>

</html>
