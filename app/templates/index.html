{% extends "base.html" %}

{% block title %}Все посты{% endblock %}

{% block content %}
    <h1>Список постов</h1>

    {% if posts %}
        <ul>
        {% for post in posts %}
            <li>
                <a href="/posts/{{ post.id }}">{{ post.title }}</a>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Пока нет ни одного поста.</p>
    {% endif %}
{% endblock %}
