{% extends "base.html" %}

{% block title %}Обо мне{% endblock %}

{% block content %}

<article class="post-detail about-page">
    <h1 class="post-detail__title">Обо мне</h1>

    <div class="about-content">

        <div class="about-intro">
            {% if about and about.photo %}
            <img src="/page/about/photo" alt="Фото Ивана Карелина" class="about-photo">
            {% endif %}

            {% if about %}
                <p class="post-detail__description">{{ about.content | safe }}</p>
            {% else %}
                <p class="post-detail__description">Здесь будет информация обо мне</p>
            {% endif %}
        </div>

    </div>
</article>

{% endblock %}
