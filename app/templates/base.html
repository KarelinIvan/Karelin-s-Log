<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Karelin's log{% endblock %}</title>
    <!-- Здесь можно подключить CSS -->
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        nav a { margin-right: 15px; }
    </style>
</head>
<body>
    <nav>
        <a href="/page">Главная</a>
        <a href="#">Авторизация</a>
        <!-- Позже здесь появятся другие ссылки (например, "Админка") -->
    </nav>

    <hr>

    <main>
        {% block content %}
        <!-- Сюда будет вставляться содержимое дочерних шаблонов -->
        {% endblock %}
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Karelin's log</p>
    </footer>
</body>
</html>
