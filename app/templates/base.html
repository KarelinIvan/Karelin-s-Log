<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Karelin's log{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="page-wrapper">
        <!-- Левая колонка -->
        <aside class="sidebar-nav">
            <!-- Верхняя группа: логотип и навигация -->
            <div class="sidebar-top">
                <div class="logo">
                    Karelin's log
                </div>
                <nav class="navi">
                    <ul>
                        <li><a href="/page/">Главная</a></li>
                        <li><a href="#">Обо мне</a></li>
                        <li><a href="#">Поиск</a></li>
                    </ul>
                </nav>
            </div>

            <!-- Нижняя группа: системный блок + копирайт -->
            <div class="sidebar-bottom">
                <div class="sistem">
                    <div>
                        <a href="#" class="auth">Войти</a>
                    </div>
                    <div>
                        <a href="#">Подписаться на рассылку</a>
                    </div>
                </div>
                <div class="copyright">
                    <p>&copy; 2026 Karelin's log</p>
                </div>
            </div>
        </aside>

        <!-- Правая колонка -->
        <div class="main-content">
            <main>
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
</body>

</html>
